name: SIT UI Test automation
on:
  workflow_dispatch:
env:
  DXP_SIT_SAO_EMAIL: ${{ secrets.DXP_SIT_SAO_EMAIL }}
  DXP_SIT_SAO_PASSWORD: ${{ secrets.DXP_SIT_SAO_PASSWORD }}
jobs:
  UI-Automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: qa

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: ENV=sit npm run test-sit-sanity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
